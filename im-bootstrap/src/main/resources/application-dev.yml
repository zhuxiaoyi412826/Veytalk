# ==============================================================================
# 开发环境。默认激活（见 application.yml 的 spring.profiles.active）。
#
# 这个 profile 的唯一职责是「让本地联调不必去猜」：把验证码答案回显出来、
# 把 SQL 与出入参打到控制台。所有回显类开关都只在这里为 true，
# 主配置与 prod 一律关闭，避免哪天忘了切 profile 就把生产环境的校验废掉。
# ==============================================================================

im:
  captcha:
    # 短信验证码是 Mock 实现（不接真实服务商），回显到响应体与日志，
    # 否则本地根本拿不到这个码，手机号登录这条路径没法测。
    expose-sms-code: true
    # 图形验证码不再回显：短信登录与邮箱登录都用它作为发信前的闸门，
    # 页面上直接看图输入即可，不需要把答案显式回显。
    expose-image-code: false
    # 邮箱验证码回显到响应体与日志。邮箱登录与邮箱找回密码都靠它联调：
    # 真实 SMTP 需要 QQ 授权码，换一台开发机就可能没有，收不到邮件时整条链路直接卡死。
    # 配了 SMTP 就照常发信、回显只是多一个答案来源；没配时靠下面的降级开关兜住。
    expose-email-code: true
    # SMTP 未配置（缺 MAIL_USERNAME / MAIL_PASSWORD）时不报 MAIL_NOT_CONFIGURED，
    # 而是只写日志 + 按 expose-email-code 回显。验证码照常写进 Redis 并参与校验，
    # 因此这条链路的代码路径与生产完全一致，只是最后一步没真发信。
    mock-mail-when-unconfigured: true

  sms:
    # mock = 只写日志，不发真实短信。换成 aliyun / tencent 时新增一个 SmsSender 实现即可，
    # 验证码的生成、频率限制、Redis 存取与校验都在 CaptchaServiceImpl 里，不用改。
    provider: mock

  remote:
    # 远程控制的 AES-256-GCM 端到端加密在 dev 下关闭。
    # 原因：手机用局域网 http://<本机IP>:5173 访问时不是安全上下文，
    # 浏览器不暴露 WebCrypto(crypto.subtle)，控制端会因拿不到密钥而连不上（画面一闪即断）。
    # 关掉后走明文中继，画面链路抓包即可还原——仅限内网演示/排障。
    # 主配置与 prod 仍为 true，切 profile 即恢复加密。
    aes: false
    # 本地联调直接打开服务端侧直连开关（prod 仍默认关，靠 IM_DIRECT_ENABLED 显式开）。
    # 两道门都在才算开：被控端 Agent 窗口里的「允许局域网/打洞直连」勾选也要打开。
    # 同机或同网段不配 IM_DIRECT_PUNCH_HOST 也能验到局域网 WebSocket 档；
    # UDP 打洞档需要一个公网可达的反射地址，本机联调时它自然回落，不影响其余功能。
    # 注意 aes=false 时握手密钥证明退化为 SHA-256(token+sid+nonce)，两端一致即可通过。
    direct:
      enabled: true

logging:
  level:
    # com.im 下的 Mapper 接口名就是 logger 名，DEBUG 级别会打出完整 SQL、
    # 参数与返回行数。因为走的是 logback，这些 SQL 自带 traceId 与 userId，
    # 能直接和同一次请求的业务日志对齐——这也是不用
    # mybatis-plus.configuration.log-impl=StdOutImpl 的原因：
    # StdOutImpl 直接写 System.out，绕过 logback，日志里既没有时间戳也没有 traceId。
    # 这一级的内容除了控制台，还会整份镜像到 ${im.log.home}/DEBUG.log（重启即清空，
    # 所以它永远只包含本次运行）。完整 SQL 里带的是真实参数值，password 一类字段
    # 只能靠按字段名打码拦下，因此开发期的日志目录同样要当敏感数据对待。
    com.im: debug
    # 连接池与 Redis 的问题在开发期同样值得看见
    com.zaxxer.hikari: debug
    org.springframework.data.redis: info
