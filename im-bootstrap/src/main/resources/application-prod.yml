# ==============================================================================
# 生产环境。启动方式：
#   java -jar im-server.jar --spring.profiles.active=prod
# 或设置环境变量 SPRING_PROFILES_ACTIVE=prod
#
# 相对主配置只做三类收敛：关掉文档、关掉一切验证码回显、收紧日志。
# 数据库与 Redis 的连接信息不在这里重复，仍然只从环境变量读取。
# ==============================================================================

# 接口文档整体关闭。/doc.html 与 /v3/api-docs 会返回 404，
# 而不是「加个拦截器挡住」——后者一旦拦截规则漏写一条，
# 全部接口的入参出参结构就等于公开挂在网上。
knife4j:
  enable: false
  production: true

springdoc:
  api-docs:
    enabled: false

im:
  captcha:
    # 主配置已经是 false，这里再写一遍是为了让「生产绝不回显验证码」
    # 成为一条显式声明，而不是依赖某个人没有去改主配置。
    expose-sms-code: false
    expose-image-code: false
    expose-email-code: false
    # 生产必须真实发信：SMTP 未配置时直接报 MAIL_NOT_CONFIGURED，
    # 而不是降级成「只写日志」。降级开着的话，忘配环境变量会变成「找回密码静默失效」，
    # 而且日志里带明文验证码——生产日志的可见范围远大于开发机。
    mock-mail-when-unconfigured: false
  sms:
    # 这里显式从环境变量读：不设 IM_SMS_PROVIDER 就退回 mock，
    # 后果是短信只写日志、用户永远收不到码（失败方向是「发不出去」而不是「绕过校验」，
    # 不会造成安全口子，但上线前必须把它换成真实服务商）。
    provider: ${IM_SMS_PROVIDER:mock}
  websocket:
    # 生产环境客户端基数大，空闲扫描放宽到 60s，减少无谓的遍历开销；
    # 断连判定仍然由 heartbeat-timeout-seconds 决定，这里只改检查频率。
    idle-check-interval-ms: 60000

server:
  tomcat:
    threads:
      # 虚拟线程已开启，平台线程池主要承载容器自身的acceptor/poller，
      # 这里适度上调以应对握手风暴（例如前端集中重连）。
      max: 400

spring:
  datasource:
    hikari:
      # 生产并发更高，把上限抬到 50。注意这个值要与 MySQL 的 max_connections
      # 以及实例数一起算：50 × 实例数 必须明显小于 max_connections，
      # 否则连接池会先把数据库的连接数抢光，新实例启动时直接连不上。
      maximum-pool-size: 50
      minimum-idle: 10

logging:
  level:
    root: info
    # 生产不打 DEBUG：WebLogAspect 在 DEBUG 下会输出完整出入参，
    # 消息正文与手机号都会落进日志文件，那是隐私数据。
    com.im: info
# 落盘目录、保留天数与体积护栏统一看 application.yml 的 im.log（可用 IM_LOG_HOME 覆盖）。
# D:/rizi1/IM 是开发机的默认值，Linux 部署时记得指到 /var/log/im 这类真实路径；
# 目录不可写时 logback 只打一条 status 错误不会拦住启动，日志会静默丢失。
