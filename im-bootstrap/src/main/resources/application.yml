# ==============================================================================
# IM 即时通讯系统 —— 主配置
#
# 约定：
#   1. 一切凭据只从环境变量读取，本文件里只出现「变量名 + 开发用默认值」，
#      不写任何真实密码，也不提供绕过环境变量的后门。
#   2. 默认激活 dev。生产启动请显式指定：
#        java -jar im-server.jar --spring.profiles.active=prod
#      或设置环境变量 SPRING_PROFILES_ACTIVE=prod。
#   3. 需要同时调整的配置项，注释里会点明「和谁一起改」，避免只改一半。
# ==============================================================================

spring:
  application:
    name: im-server

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ---------------------------------------------------------------------------
  # 排除 Sa-Token 自带的 Redis 存储自动配置
  #
  # 它注册的 SaTokenDaoForRedisTemplate 在写回会话时下发 SET ... KEEPTTL XX，
  # 而 KEEPTTL 要 Redis 6.0 以上，在 Redis 5 上服务端回 ERR syntax error，
  # 结果是登录、续期、多端登记全部失败。
  # 这里换成 com.im.common.security.SaTokenDaoForLegacyRedis —— 同一个类的子类，
  # 只把这一个方法改成 PTTL + SET XX 两步，语义完全等价。
  #
  # 这条 exclude 与那个类是成对存在的，改一处必须改另一处：
  # 少了 exclude 会有两个 SaTokenDao 候选，Sa-Token 的注入点消不掉歧义，启动直接失败；
  # 反过来只留 exclude 而没有那个类，Sa-Token 会退回内存实现，
  # 表现为「重启就全员掉线、多实例之间登录态互不承认」，且不报任何错。
  # ---------------------------------------------------------------------------
  autoconfigure:
    exclude:
      - cn.dev33.satoken.dao.SaTokenDaoForRedisTemplate

  # ---------------------------------------------------------------------------
  # 虚拟线程（JDK 21）
  #
  # 收益：IM 的接口大多是「一次数据库往返 + 一次 Redis 往返 + 一次 WebSocket 推送」，
  # 典型的阻塞 I/O 密集型，虚拟线程能让 Tomcat 不再受 200 条平台线程的并发上限约束。
  #
  # 代价：JDK 21 上虚拟线程在 synchronized 块内阻塞会「钉住」载体线程，
  # 而 Tomcat 的 WebSocket 写出路径内部有 synchronized。极端情况是大量弱网客户端
  # 同时卡住发送，把载体线程（默认与 CPU 核数相同）钉满，进而拖慢整个进程。
  # 已用 im.websocket.send-time-limit-ms 与 send-buffer-size-bytes 限制单个连接的
  # 阻塞时长与积压量来收敛这个风险。若压测中确实观察到钉住，把 enabled 改为 false
  # 即可退回平台线程模型，业务代码无需任何改动。
  # ---------------------------------------------------------------------------
  threads:
    virtual:
      enabled: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # characterEncoding 用 Java 的字符集名 UTF-8，不能写 utf8mb4：
    # utf8mb4 是 MySQL 侧的字符集名，Java 没有这个 charset，写上去连接期就会抛
    # UnsupportedEncodingException。Connector/J 8 会在握手时自动协商成服务端的
    # utf8mb4，emoji 等四字节字符照样存得下——真正决定能否存 emoji 的是建表时的
    # DEFAULT CHARSET utf8mb4（见 sql/im_schema.sql），不是这个连接参数。
    url: "jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:im_db}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true"
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      pool-name: ImHikariPool
      # 最小空闲与最大连接数刻意不相等：IM 的负载是明显的波峰波谷，
      # 低谷期没必要占着 20 条连接；但也不能设成 0，否则每次波峰都要现建连接。
      minimum-idle: 5
      maximum-pool-size: 20
      # 获取连接的等待上限。设成 30s 是为了让「连接池耗尽」快速失败并留下明确异常，
      # 而不是让请求无声地排队几分钟——后者的表现是前端一直转圈，日志里什么都没有。
      connection-timeout: 30000
      idle-timeout: 600000
      # 必须小于 MySQL 的 wait_timeout（默认 8 小时），否则连接被服务端单方面断开后，
      # 池里会留下一批「看着健康、一用就报 Communications link failure」的死连接。
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # 空字符串等价于「不设密码」：Spring 的 RedisPassword.of 会用 hasText 过滤掉空值，
      # 不会向未设密码的 Redis 发 AUTH 命令。
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5s
      connect-timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3s
        shutdown-timeout: 200ms

  servlet:
    multipart:
      enabled: true
      # 与 im.file.max-size 是一对：这里是 Servlet 容器的硬上限，先于业务代码生效。
      # 只调 im.file.max-size 的话，请求会先被这里拦下并抛 MaxUploadSizeExceededException，
      # 返回的错误码与真正起作用的那道限制对不上。两个值必须一起改。
      max-file-size: 100MB
      max-request-size: 110MB

  web:
    resources:
      # 必须保持开启（这也是默认值）：knife4j 的 /doc.html 与 /webjars/**
      # 都来自 jar 内的 META-INF/resources，靠 Spring MVC 的静态资源映射才能访问。
      # 关掉它的表现是「接口全通、文档 404」，很容易被误判成 knife4j 版本不兼容。
      add-mappings: true

  # ---------------------------------------------------------------------------
  # 邮箱（QQ 邮箱 SMTP）——邮箱验证码登录用
  #
  # MAIL_USERNAME 是完整邮箱地址（如 123456@qq.com），MAIL_PASSWORD 是 QQ 邮箱的
  # 「SMTP 授权码」而不是 QQ 登录密码：授权码在 QQ 邮箱 → 设置 → 账户 →
  # 「POP3/IMAP/SMTP服务」里开启并生成。用登录密码会直接 535 认证失败。
  # 465 端口走 SSL；两个环境变量都没配时，发信会抛 MAIL_NOT_CONFIGURED，
  # 不影响其余登录方式。
  # ---------------------------------------------------------------------------
  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
        # 连接/读写超时，避免 SMTP 卡死拖住请求线程
        debug: false
    test-connection: false

  # ---------------------------------------------------------------------------
  # AI 面试官（阿里云百炼 DashScope，OpenAI 兼容协议）
  #
  # 消费方是 im-ai 模块的 AiProperties（未引入 Spring AI 依赖，配置坐标保持
  # spring.ai.openai 的写法，将来切真 Spring AI 时 yml 不用改）。
  # ALI_BABA_API_KEY 未设置时面试接口返回明确的「API Key 未配置」错误，
  # 不影响其余功能启动与使用。
  # ---------------------------------------------------------------------------
  ai:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${ALI_BABA_API_KEY:}
      chat:
        options:
          # 模型名称可配置（百炼模型名，例如 qwen-flash / qwen-plus / qwen-max）
          model: ${AI_MODEL_NAME:qwen-flash}
          temperature: 0.7
          timeout: 60s

server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      # force 让请求与响应都强制按 UTF-8 解码编码，否则浏览器不带 charset 时
      # 中文文件名、中文昵称会按 ISO-8859-1 解析成乱码。
      force: true
  tomcat:
    uri-encoding: UTF-8
    # 每条 WebSocket 连接都会长期占用一个 connection 名额，
    # 默认 8192 对 IM 来说偏小，这里放宽；真正的内存约束由
    # im.websocket.send-buffer-size-bytes 按连接数兜住。
    max-connections: 20000
    accept-count: 200
    threads:
      max: 200
      min-spare: 10
    # 上传大文件时请求体可能超过默认 2MB 的表单上限
    max-http-form-post-size: 110MB
    max-swallow-size: 110MB

# ==============================================================================
# MyBatis-Plus
# ==============================================================================
mybatis-plus:
  # 当前所有 SQL 都写在 Mapper 注解里（含 <script> 动态标签），没有 XML。
  # 保留这一行是为了以后加复杂 SQL 时不必回头改配置。
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.im.**.entity
  configuration:
    map-underscore-to-camel-case: true
    # 二级缓存必须关：它是 SqlSession 级的本地缓存 + 跨节点不可见，
    # 多实例部署时会出现「A 节点改了、B 节点还读到旧值」，
    # 而未读数、会话最后一条消息恰恰是最不能读到旧值的数据。
    cache-enabled: false
    # 单条语句超时上限（秒）。IM 的查询都走索引，正常在毫秒级，
    # 10s 还没回来一定是出了问题，及早失败比拖住连接池更好。
    default-statement-timeout: 10
    default-fetch-size: 1000
  global-config:
    banner: false
    db-config:
      # 雪花 ID。不用数据库自增：分库分表时会冲突，而且自增 ID 会把
      # 「一共发了多少条消息」这种业务信息暴露给客户端。
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      table-underline: true
      # NOT_NULL 策略意味着实体字段为 null 时不会进入 UPDATE 语句，
      # 所以「把某列显式置为 NULL」必须用 .setSql("col = NULL")，
      # 用 .set(Entity::getX, null) 是静默无效的。
      insert-strategy: not_null
      update-strategy: not_null

# ==============================================================================
# Sa-Token
# ==============================================================================
sa-token:
  # 前端请求头名，同时是 Cookie 名与 URL 参数名
  token-name: satoken
  # 登录态有效期 7 天
  timeout: 604800
  # -1 表示不做「最低活跃频率」检查：IM 客户端可能整夜挂着不操作，
  # 设成正数会把人半夜踢下线。真正的连接活性由 WebSocket 心跳负责。
  active-timeout: -1
  # 允许同一账号多端同时在线（web / pc / android 各自独立），且同设备位也允许多条会话共存：
  # 同一浏览器的多个标签页、Electron 的多个窗口都不再互相顶号（多标签互踢 bug 的修复项）。
  # 历史行为：登录时由 AuthServiceImpl#kickSameDevice 顶掉同设备旧会话，该方法已移除；
  # 踢下线能力仅保留给管理操作（封号、改密码后全端下线，见 WsSessionManager#kickOut）。
  # 若改成 false，Sa-Token 会在登录流程里抢先调用 replaced(loginId, device)，第二个标签页登录会顶掉第一个。
  is-concurrent: true
  # 必须为 false：StpLogicJwtForSimple 的 isSupportShareToken() 返回 false，
  # 设成 true 会导致同账号第二次登录复用第一个 token，各端会话无法独立管理与独立注销。
  is-share: false
  # JWT 模式下 token 本身就是一个 JWT，这个 token-style 实际不生效，
  # 保留仅为与 Sa-Token 默认值显式对齐，便于日后关掉 JWT 插件时对照。
  token-style: uuid
  is-log: false
  # 只从请求头读 token。关掉 Cookie 读取是 WebSocketConfig 里
  # setAllowedOriginPatterns("*") 能够成立的前提之一——不存在浏览器自动携带的凭证，
  # 跨站 WebSocket 劫持就没有立足点。
  is-read-cookie: false
  is-read-header: true
  is-read-body: false
  # 登录态 JWT 的签名密钥。生产环境必须通过 IM_JWT_SECRET 覆盖，
  # 默认值只能用于本地开发，泄露它等于任何人都能伪造登录态。
  jwt-secret-key: ${IM_JWT_SECRET:im-sa-token-dev-only-secret-key-please-change-in-production-0123456789}

# ==============================================================================
# 接口文档（Knife4j / springdoc）
# 分组由 Knife4jConfig 的 9 个 GroupedOpenApi Bean 定义，按模块划分。
# ==============================================================================
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-footer: false
    enable-group: true
    swagger-model-name: 数据模型

springdoc:
  api-docs:
    enabled: true
  # 刻意不设 swagger-ui.enabled=false，宁可留着启动时那条
  # "/swagger-ui.html endpoint is enabled by default" 的 WARN。
  # 实测关掉它会连带禁用 /v3/api-docs/swagger-config（OpenAPI 的分组发现端点）：
  # 该路径随后被 /v3/api-docs/{group} 的通配 handler 捕获，把 "swagger-config"
  # 当成分组名去查，查不到就在 AbstractMultipleOpenApiResource
  # #getOpenApiResourceOrThrow 抛异常，最终被兜成 1007 系统繁忙。
  # 生产环境不靠这一项收口：application-prod.yml 里的 api-docs.enabled=false
  # 已经让所有文档端点返回 404。
  packages-to-scan: com.im
  default-flat-param-object: true

# ==============================================================================
# 项目自定义配置，对应 com.im.common.config.ImProperties
# ==============================================================================
im:
  jwt:
    # 短时票据（WebSocket 连接票据、文件访问票据）的签名密钥，
    # 与上面的 sa-token.jwt-secret-key 刻意用不同的值：
    # 两把密钥一旦相同，一张 WS 票据在理论上就与登录态同源，
    # 校验逻辑的任何疏漏都会被放大成账号接管。分开之后，
    # 即便票据密钥泄露，也伪造不出登录 token。
    secret: ${IM_TICKET_SECRET:im-ticket-dev-only-secret-key-please-change-in-production-0123456789}
    # WS 握手票据有效期。够前端拿到票据后立刻发起握手即可；
    # 设长会让票据在 URL、代理日志、浏览器历史里长时间可用。
    ticket-ttl-seconds: 60
    # 文件访问票据有效期。不能太短：浏览器渲染 <img src> 时带不上请求头，
    # 图片全靠 URL 上的票据，一过期整屏图就碎。
    file-ticket-ttl-seconds: 1800

  security:
    # argon2 | bcrypt。argon2 抗 GPU 暴破更强，是默认选择；
    # 切换后老密码仍然能校验（hash 自带算法标识），新密码按新算法写入。
    password-encoder: argon2

  # 接口限流：端点级配额写在 @RateLimit 注解里（登录/验证码/上传/发消息），
  # 这里只配总开关与全局按 IP 兜底。计数器优先落 Redis（多实例共享配额），
  # Redis 不可用时退化为进程内计数（fail-open，限流是护栏不是闸门）。
  rate-limit:
    enabled: true
    # 单 IP 全局兜底：300 次/10 秒。内网多人共用出口 IP 部署时需按人数上调
    global-count: 300
    global-seconds: 10
    # WebSocket 通道单用户发消息频率：超限回 error 帧（code=1010），不断连接
    ws-chat-count: 60
    ws-chat-seconds: 60

  file:
    # local | minio。默认 local，没装 MinIO 也能跑通全部功能；
    # 改这一行即可切到 MinIO，无需改代码。
    storage: ${IM_FILE_STORAGE:minio}
    access-url-prefix: /api/file/download
    # 是否对图片返回 MinIO 预签名直链。默认 false，走后端受控下载，
    # 这样每一次图片访问都经过会话成员校验；
    # 只有在确认桶不可公开、且需要给 CDN 减压时才打开。
    use-presigned-url: false
    # 与 spring.servlet.multipart.max-file-size 一起改，理由见上方注释
    max-size: 100MB
    max-avatar-size: 2MB
    local:
      # 本地存储根目录，按 yyyy/MM/dd/uuid.ext 分目录落盘
      base-dir: ${IM_FILE_DIR:${user.home}/im-files}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      # 桶不存在时启动阶段会自动创建，无需手工建桶。
      # 桶名须符合 S3 规范：≥3 字符、仅小写字母/数字/点/连字符；"im" 这类过短名会被 SDK 拒绝导致启动失败
      bucket: ${MINIO_BUCKET:im-files}
    # 分片上传（断点续传 + 秒传）。分片先落本地临时目录，合并后再写入上面的 storage，
    # 因此即便 storage=minio，tmp-dir 所在磁盘也必须可读写。
    upload:
      # 分片临时目录，合并成功即清理，过期会话由定时任务回收
      tmp-dir: ${IM_UPLOAD_TMP_DIR:${user.home}/im-upload-tmp}
      # 服务端权威分片大小，init 时下发给前端，前端必须按它切片
      chunk-size: 5MB
      # 单个分片请求体上限，给 chunk-size 留出表单字段开销余量；
      # 单个分片远小于 spring.servlet.multipart.max-file-size，走分片通道的大文件不受那道 100MB 限制
      max-chunk-size: 6MB
      # 走分片通道的整体文件大小上限
      max-size: 2GB
      # 上传会话（临时分片）保留时长（秒），默认 24 小时
      session-ttl-seconds: 86400
      # 单文件最多分片数，防御性上限
      max-chunks: 100000

  message:
    # 撤回时限（秒），默认 2 小时。超过这个时间的消息只能删除（仅本端不可见），不能撤回。
    recall-limit-seconds: 7200
    history-page-size: 20
    max-text-length: 5000
    # 敏感词过滤：命中后遮成 * 再落库投递（不拒发），词库在 im-common 的
    # wordlists/sensitive_words.txt，DFA 字典树匹配时原地跳过干扰字符
    sensitive-filter-enabled: true
    # 消息保留天数：超过后由定时任务物理删除（含回执与单端删除记录）。
    # 0 = 永不清理（默认）；聊天历史删除必须显式开启，不要依赖默认值意外丢数据。
    retention-days: 0
    # 清理任务 cron，默认每天凌晨 3:30 低峰执行，仅在 retention-days > 0 时生效
    clean-cron: 0 30 3 * * ?

  websocket:
    # 建议客户端心跳间隔，握手成功后随欢迎帧下发，前端不必硬编码
    heartbeat-interval-seconds: 30
    # 必须是心跳间隔的 2~3 倍，给网络抖动留余量；
    # 同时要与 im-user 里 OnlineStatusSpiImpl 的在线键 TTL（90s）保持一致，
    # 否则会出现「WS 还连着，Redis 在线键已过期」的不一致窗口。
    heartbeat-timeout-seconds: 90
    idle-check-interval-ms: 30000
    # 单条文本帧上限。Tomcat 默认只有 8KB，而 max-text-length 允许 5000 字，
    # 中文 UTF-8 每字 3 字节就是 15KB，不抬高会被容器直接以 TOO_BIG 断连，
    # 且服务端日志里看不到任何业务异常。
    max-text-message-bytes: 65536
    # 单个连接的最长发送耗时与积压上限，交给 ConcurrentWebSocketSessionDecorator。
    # 推送发生在业务线程上，一个卡住的慢客户端足以拖慢整个群发循环，
    # 超过阈值直接判定该会话不可靠并关闭，而不是让线程陪着等。
    send-time-limit-ms: 10000
    send-buffer-size-bytes: 524288

  cors:
    # 前端 vite 开发服务器与预览服务器。http 与 https 两种方案都要放行：
    # 局域网真机联调远程控制时 dev server 会自签证书走 https（页面 Origin 变
    # https://<host>:5173），只配 http 会让登录这类同源 POST 回 403 Invalid CORS request。
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:4173
      - http://127.0.0.1:4173
      - https://localhost:5173
      - https://127.0.0.1:5173
      - https://localhost:4173
      - https://127.0.0.1:4173
      # 局域网真机联调（手机连电脑、或电脑连手机热点）：手机用电脑的局域网 IP 打开页面，
      # 浏览器发出的 /api 请求虽然经 vite 代理转发、看着是同源，但代理的 changeOrigin
      # 只改 Host 头不改 Origin 头，而 Spring 判定 CORS 请求只看有没有 Origin 头，
      # 于是这里仍会校验白名单——不放行局域网地址，手机上就是「页面打得开、接口全 403」。
      #
      # 写成 *.*.*.* 而不是 * ：实测 * 会把 evil.example.com:5173 这类域名一并放行，
      # 四段通配只匹配 IPv4 形式的 origin，域名一律拒绝，端口也锁死在 5173/4173。
      # 上线到公网前必须把这两条换成真实域名。
      - http://*.*.*.*:5173
      - http://*.*.*.*:4173
      - https://*.*.*.*:5173
      - https://*.*.*.*:4173

  captcha:
    image-ttl-seconds: 300
    sms-ttl-seconds: 300
    # 同一手机号两次短信的最小间隔，挡住短信轰炸与费用消耗
    sms-interval-seconds: 60
    # 邮箱验证码有效期与同一邮箱的最小发送间隔（秒）
    email-ttl-seconds: 300
    email-interval-seconds: 60
    # 是否在响应里回显验证码。主配置一律 false，只有 dev profile 打开；
    # 生产环境回显验证码等于把这道校验彻底废掉。
    expose-sms-code: false
    expose-image-code: false
    expose-email-code: false
    image-required: true
    # SMTP 未配置（缺 MAIL_USERNAME / MAIL_PASSWORD）时，邮件验证码是否降级为
    # 「只写日志 + 按 expose-email-code 回显」而不直接报 MAIL_NOT_CONFIGURED。
    # 主配置 false：邮箱登录与邮箱找回密码都要求真实发信才算数；dev profile 打开它，
    # 没有 QQ 授权码的机器也能把这两条链路跑通。生产打开等于任何人都能靠回显拿到验证码。
    mock-mail-when-unconfigured: false

  # 短信下发通道：mock = 只写日志、不发真实短信（默认，本地开发够用）。
  # 接阿里云/腾讯云时新增一个 SmsSender 实现，标
  # @ConditionalOnProperty(name = "im.sms.provider", havingValue = "aliyun")，
  # 再把这里（或 IM_SMS_PROVIDER 环境变量）改成 aliyun 即可：
  # 验证码的生成、频率限制、Redis 存储与校验都在 CaptchaServiceImpl 里，一行都不用动。
  sms:
    provider: ${IM_SMS_PROVIDER:mock}

  # AI 面试官与全网检索（im-ai 模块 ImAiProperties）：模型接入参数在上面的 spring.ai.openai，
  # 这里只管知识库、对话策略与网络检索入口。
  ai:
    enabled: true
    # 知识库目录，递归扫描 .md/.txt；目录内容增删改后自动重建索引（无需重启）。
    # Windows 路径用正斜杠写法，避免 yml 转义问题。
    knowledge-dir: ${IM_AI_KNOWLEDGE_DIR:D:/资料/知识库/面试官}
    # 每轮注入提示词的知识片段条数与总字符上限
    retrieve-top-k: 4
    max-knowledge-chars: 6000
    # 发送给模型的历史消息条数上限与单条长度上限（防御性裁剪）
    max-history: 30
    max-message-chars: 4000
    # 目录重扫最小间隔（秒）
    rescan-interval-seconds: 30
    # 监考：面试页的切屏/粘贴检测与处置（im-ai 模块 InterviewAuditService）。
    # 前端只上报「发生了什么」，算不算违规、是否强制结束全在这里定。
    proctor:
      enabled: true
      # 违规累计达此数就强制结束面试；0 或负数 = 只留痕不中断（练习模式）
      violation-limit: 8
      # 关掉后只记录不拦截，用来先观察阈值定得合不合适
      enforce-limit: true
      # 以下开关决定「哪类动作计入违规」，也决定前端要不要监听它
      count-blur: true
      count-visibility-hidden: true
      count-paste: true
      count-fullscreen-exit: true
      # 复制/剪切/右键大多是无害操作（拖动文字、调输入法），默认只留痕不计违规
      count-copy: false
      count-cut: false
      count-contextmenu: false
      max-events-per-batch: 100
      max-detail-chars: 500
    # 全网检索：消息搜索框（搜索全部会话/网络）里「网络」分组的数据源。
    # 实现是抓取结果页 HTML 再解析，入口改版会拿不到结果；所有失败都只让
    # 网络分组空白，不影响本地消息检索，所以这里不需要开关以外的降级手段。
    web-search:
      enabled: true
      endpoint: https://cn.bing.com/search
      # 抓取超时（秒）：宁可不出网络结果，也不让请求线程挂在跨网抓取上
      timeout-seconds: 6
      max-results: 10
      max-keyword-chars: 60
      max-snippet-chars: 200
      # 同一关键字的结果缓存有效期，命中后不打外网
      cache-seconds: 600

  # 三级缓存：L1 Caffeine（JVM 本地）→ L2 Redis（分布式）→ L3 MySQL。
  # 读路径逐层回源并回填，写路径由业务更新后主动失效；Redis 不可用时自动退化为 L1+DB。
  # 已接入：用户精简资料（user:brief:*）、群静态资料（group:brief:*）。
  # CDN 层本期不实现：静态资源缓存由部署层 Nginx 的 Cache-Control 承担。
  cache:
    enabled: true
    # L1 最多缓存多少个 key，防堆内存膨胀
    l1-max-size: 10000
    # L1 过期秒数：也是多节点间脏数据的最大收敛窗口（evict 只失效本节点 L1），不要调大
    l1-ttl-seconds: 120
    # L2（Redis）默认过期秒数
    l2-ttl-seconds: 1800
    # 空值哨兵在 L2 的过期秒数：防穿透，又不让新建数据长期隐身
    null-ttl-seconds: 60

  # ---------------------------------------------------------------------------
  # 远程控制（im-remote 中继模块）
  #
  # 拓扑：被控端 Agent 与控制端浏览器/Electron 都主动连服务器，服务端按会话双向转发。
  # 中继带宽是这个功能最容易被误配的地方：一屏增量 JPEG 约几十 KB、20fps 就是单会话
  # 1MB/s 上行，所以帧大小上限与空闲超时都必须有服务端硬限制，不能指望两端客户端自觉。
  # 键名对应 com.im.remote.config.RemoteProperties（kebab-case ↔ camelCase）。
  # ---------------------------------------------------------------------------
  remote:
    # 总开关：关闭后 REST 与 /ws/remote/agent、/ws/remote/control 两个端点都拒绝服务，
    # 已建立的 Agent 连接会被直接关闭。只想临时停用远程能力时改这一行即可，无需改代码。
    enabled: true
    # 屏幕/文件载荷的 AES-256-GCM 端到端加密。中继服务器设计上只路由不解密，
    # 开着时它连画面内容都看不到；关掉仅用于内网演示排障——链路抓包即可还原屏幕。
    aes: true
    # 会话空闲多少分钟后服务端主动断开并通知双方（两端都没有任何帧往来）。
    # 太短会在看静态页面时误杀会话，太长会让忘记结束的会话一直占着设备为「使用中」。
    idle-timeout-minutes: 5
    # 邀请发出后被控端多少秒内未弹窗授权则自动作废，控制端轮询到点也会收起「等待授权」。
    # 与前端 startPolling 的 70s 上限配套：这个值必须小于轮询总时长，否则永远等不到超时。
    invite-timeout-seconds: 60
    # 单个二进制帧（屏幕块 / 文件块）的字节上限，超过即关闭连接，防恶意超大帧撑爆内存。
    # 1MB 对 64x64 网格的 JPEG 脏块足够宽裕；文件分块固定 64KB，远不到这条线。
    max-frame-bytes: 1048576
    # 单条文本帧字节上限。cmd 回显、文件目录列表 JSON 都走文本帧，
    # 256KB 能容纳两千条目录项或一大段命令输出，再大由业务侧截断。
    max-text-bytes: 262144
    # Agent 心跳建议间隔（秒），握手 ready 帧下发给 Agent；服务端按 3 倍（90s）判离线。
    # 与 WebSocket 主通道一致，改这里要同步改 RemoteRelayService 里的离线倍率。
    heartbeat-interval-seconds: 30
    # 一次性控制端连接票据有效期（秒）。控制端拿到 ticket 后立刻发起 /ws/remote/control 握手，
    # 握手成功即消费，60s 足够覆盖「前端拿到 ticket → 建连」的往返，设长会放大票据在 URL 里的暴露窗口。
    control-ticket-ttl-seconds: 60

    # -------------------------------------------------------------------------
    # 直连（P2P）：控制端与被控端之间绕过中继的第三条通路
    #
    # 默认 enabled: false 是有意的——开启后被控机会常开两个监听端口
    # （TCP 18924 / UDP 18925，由 Agent 侧配置决定），这是整套远程能力里唯一
    # 「往内网开口子」的变化，必须由部署方显式决定。关闭时中继行为与引入
    # 直连之前逐字节一致，两端只会走中继。
    #
    # ★ 需要放行的端口（Windows 防火墙示例，管理员 PowerShell 执行一次）：
    #     服务器：netsh advfirewall firewall add rule name="IM Punch" dir=in action=allow protocol=UDP localport=8947
    #     被控机：netsh advfirewall firewall add rule name="IM Direct TCP" dir=in action=allow protocol=TCP localport=18924
    #     被控机：netsh advfirewall firewall add rule name="IM Direct UDP" dir=in action=allow protocol=UDP localport=18925
    #   被控机那两条只在「同网段直连 / 打洞直连」时用得到；不开 direct 就不用放行。
    #   首次启动 Agent 时 Windows 也会自己弹确认框，点「允许」等价于上面两条规则。
    #
    # ★ PUNCH_HOST 必须是客户端真能访问到的公网地址（公网 IP 或已解析到它的域名），
    #   留空等于放弃 UDP 打洞档，只剩局域网直连与中继，不会报错也不会重试。
    #   服务器在 NAT / 云厂商安全组后面时，除了放行 UDP 8947 入站，还要做端口转发，
    #   且转发的必须是同一个 UDP 端口（反射服务靠收包源的 ip:port 判断「你是谁」，
    #   经端口转换后回显的就是转换前的地址，打洞会打进错误的地方）。
    #
    # ★ 直连失败永远不是错误：对称 NAT、对方防火墙拒连、Agent 没开直连开关都是常态，
    #   中继 WS 全程另开一条兜住，用户视角最坏就是「和没做直连之前一样」。
    #
    # 键名对应 com.im.remote.config.RemoteProperties.Direct（kebab-case ↔ camelCase）。
    # -------------------------------------------------------------------------
    direct:
      # 服务端侧总开关：关闭后不下发直连票据、不透传候选帧，两端只会走中继
      enabled: ${IM_DIRECT_ENABLED:false}
      # 局域网直连（TCP + 被控端自实现的 WebSocket）：同网段零配置可用，不需要打洞
      lan-enabled: true
      # UDP 打洞（仅 Electron 桌面端可用：浏览器开不了原始 UDP，手机浏览器永远享受不到这一档）
      udp-enabled: true
      # 打洞地址反射服务对外可达的地址。NAT 后的两端看不到自己对外暴露的 ip:port，
      # 必须问服务端「我看起来是谁」；这个值没法由服务端猜，只有部署方知道自己是否直连公网。
      punch-host: ${IM_DIRECT_PUNCH_HOST:}
      # 反射服务监听的 UDP 端口，与 HTTP 端口无关，需单独放行 UDP 入站
      punch-port: ${IM_DIRECT_PUNCH_PORT:8947}
      # 反射服务对单个来源地址的问答次数上限（滑动 60 秒窗口）。
      # 这个接口无状态、无鉴权，不限流就会被当成 UDP 放大/反射探测的免费跳板。
      punch-rate-limit: 20
      # 直连票据有效期（秒）：只覆盖「建会话到直连握手完成」这段窗口，不做长期凭证。
      # 调大并不会让直连更稳（握手成功即失效），只会延长票据在日志里的可被利用时间。
      token-ttl-seconds: 60
      # 单个 DXP 报文的字节上限（UDP 分片尺寸）。1200 加 IP/UDP 头正好一个以太网帧，
      # 抬高到 1400 以上会在部分链路上触发 IP 分片，分片包被路由器丢弃的概率远高于整包。
      mtu: 1200
      # 直连握手尝试预算（毫秒）：超时即判该档不可用，落回下一档，不反复重试
      handshake-timeout-ms: 3000

  # ---------------------------------------------------------------------------
  # 直播（im-live 控制面模块）
  #
  # 拓扑：推流端（Electron + 已捆绑 ffmpeg）硬编切 HLS 分片 → PUT 到 Nginx 推流口；
  #       观众从 Nginx 播放口拉 m3u8；Java 只管房间状态、播放地址签名与弹幕通道，
  #       一个媒体字节都不碰。键名对应 com.im.live.config.LiveProperties。
  #
  # ★ play-base-url / push-base-url 必须由部署方显式配置：它们取决于 Nginx 挂在哪个
  #   域名/端口、location 前缀是什么，服务端猜不出来。留空时开播接口直接报
  #   LIVE_NOT_CONFIGURED（11002），而不是下发一个拼不出来、要等播放器 404 才暴露的相对地址。
  # ★ sign-secret 必须与 Nginx secure_link_md5 用的密钥逐字一致，生产环境经环境变量注入。
  # ---------------------------------------------------------------------------
  live:
    # 总开关：关闭后开播/观看接口与 /ws/live 弹幕端点全部拒绝服务
    enabled: ${IM_LIVE_ENABLED:true}
    # 播放基址：观众请求 m3u8 的 URL 前缀。默认 /hls 是相对路径——前端按访问源自动补全
    # （开发期 vite proxy /hls→本机 8088，生产 Nginx 同域反代），DHCP 换 IP 无需改这里。
    # 最终地址 = {play-base-url}/{roomId}/{streamKey}/index.m3u8?expire=&sign=
    play-base-url: ${IM_LIVE_PLAY_BASE_URL:/hls}
    # 推流基址：ffmpeg -method PUT 的目标前缀。推流端与流媒体服务器同在本机，用 127.0.0.1
    # 恒不受局域网 IP 变化影响；只在服务端与主播之间用，不对外发布
    push-base-url: ${IM_LIVE_PUSH_BASE_URL:http://127.0.0.1:8088/hls}
    # 播放地址签名密钥，必须与 Nginx secure_link_md5 "$uri$arg_expire$secret" 的 secret 一致
    sign-secret: ${IM_LIVE_SIGN_SECRET:im-live-dev-secret-change-me}
    # 播放地址有效期（秒），默认 6 小时：覆盖一场直播，泄露的地址也不会长期可用
    sign-ttl-seconds: 21600
    # 推流端心跳间隔建议值（秒），随开播响应下发；服务端按 heartbeat-timeout-factor 倍判超时
    heartbeat-seconds: 15
    # 心跳超时倍数：超过 heartbeat-seconds × 该倍数没心跳即判定断播并自动关播
    heartbeat-timeout-factor: 4
    # 单条弹幕最大字符数，超出直接拒绝（不截断）
    danmaku-max-length: 100
    # 单个连接每秒最多发几条弹幕，防脚本刷爆房间
    danmaku-per-second: 3
    # 房间标题最大长度
    title-max-length: 60
    # 单个用户同时能开几个直播中的房间
    max-living-rooms-per-user: 1
    # 在线人数计数键的 TTL（秒）：正常路径成对增减，TTL 只是进程被 kill / 连接泄漏时的兜底
    online-key-ttl-seconds: 7200
    # 已结束房间在大厅列表的可见时长（分钟）：关播超过它就不再显示，免得列表堆满历史场次。
    # 只影响列表展示；直播中 / 已封禁的房间、以及房间详情与「我的直播」面板都不受此限。配 0 或负数=不过滤。
    ended-room-visible-minutes: ${IM_LIVE_ENDED_ROOM_VISIBLE_MINUTES:60}
    # 关播后房间保留「聊天模式」的时长（分钟）：画面立即作废（观众端黑屏），弹幕连接保留继续聊天，
    # 到时巡检任务提示并断开全部连接彻底关房。封禁房不进聊天模式；配 0 或负数=关播立即全断。
    ended-chat-minutes: ${IM_LIVE_ENDED_CHAT_MINUTES:60}

  # --------------------------------------------------------------------------
  # 日志落地：目录、保留天数、体积护栏与慢 SQL 阈值
  # 格式与滚动策略在 im-common 的 logback-spring.xml，它按属性名直接读这几个 key
  # （logback 初始化早于 Spring 容器，拿不到 ImProperties 实例），默认值与该类和
  # logback 里的 defaultValue 三处必须一致。
  # --------------------------------------------------------------------------
  log:
    # 日志根目录，Windows 与 Linux 都认这种正斜杠写法。目录不存在时 logback 会自建，
    # 但父目录不可写时它只打一条 status 错误、不会让启动失败——日志静默丢失比启动失败
    # 更难发现，部署后记得去这个目录确认文件确实生成了。
    home: ${IM_LOG_HOME:D:/rizi1/IM}
    # 单条语句执行超过这个耗时（毫秒）就进 <home>/SQL/ 目录；0 或负数表示关掉
    slow-sql-millis: 100
    # 单个文件到这个体积就滚下一个序号，防止单日日志把磁盘写满
    max-file-size: 50MB
    # 普通档保留天数
    max-history: 30
    # 单个 appender 的归档体积上限，天数未到期但体积超了也会删最旧的
    total-size-cap: 5GB
    # 错误档留更久：量最小、复盘时最想翻
    error-max-history: 60

# ==============================================================================
# 日志级别
# 落盘位置与滚动策略在上面 im.log 以及 im-common 的 logback-spring.xml 里，
# 这里只管级别。logging.file.path 已经不再参与：自定义配置里没有读它。
# ==============================================================================
logging:
  level:
    # root 钉在 INFO：抬到 DEBUG 会把 Tomcat / Netty / Spring 的内部调试日志一并放进来，
    # 刷屏到看不出自己的日志。本项目的 DEBUG 由 dev profile 单独打开（com.im: debug）。
    root: info
