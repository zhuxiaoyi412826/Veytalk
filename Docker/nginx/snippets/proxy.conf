# ==============================================================================
# 反代公共头：被 im.conf 里每个 location /api 引用（四个 server 块各写一遍迟早写漏一条）。
# ★ 这四行的意义是让后端拿到「真实的客户端与协议」：
#   - Host 不对，后端拼出的回调地址 / 重定向就指向 nginx 的内网名；
#   - X-Forwarded-For 不对，后台「登录IP」「在线设备」里全是 172.18.0.1（容器网关）；
#   - X-Forwarded-Proto 不对，后端判断 https 失败，生成的分享链接是 http，浏览器判定为混合内容。
# ==============================================================================
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
