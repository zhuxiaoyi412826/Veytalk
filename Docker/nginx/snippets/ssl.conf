# ==============================================================================
# TLS 参数：被每个 443 server include（证书路径本身在各 server 里写，因为只有那里知道 server_name）。
# ssl.conf 与 proxy.conf 都放在 snippets/ 而不是 conf.d/ —— conf.d 下的 *.conf 会被主配置
# 当 http 上下文自动 include，把 proxy_set_header 那种指令扔进 http 层虽然能过，
# 但把 server 块以外的片段扔错目录早晚会让 nginx -t 失败。
# ==============================================================================
ssl_protocols TLSv1.2 TLSv1.3;
# 默认套件即可（Mozilla intermediate 级别）；手写高安全字符串的常见结果是「PC 能开、安卓 4.4 以下打不开」
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP 装订依赖可信根与解析器，官方镜像里常配不通，索性关掉（关掉只是少一次吊销检查，不影响握手）
ssl_stapling off;

# ★ HSTS：默认**注释掉**。一旦下发，浏览器在 max-age 内只认 https，而且没有「继续访问」按钮可点，
#   回退只能清浏览器 HSTS 列表或换域名。本目录默认用的是 `bootstrap.sh` 签的 30 天自签证书，
#   自签 + HSTS 同时开的意思就是：证书一过期（而 nginx 不校验自己证书的有效期，照样把这张过期的递出去），
#   浏览器与国产 WebView、Electron 桌面端会彻底锁死，连手动点过去的路都堵死。
#   什么时候打开：证书换成 certbot 真签发、443 跑稳、且自动续期链路（拷证书 + reload）已验证之后。
#   也别急着写 includeSubDomains —— 那会把所有子域一起锁进来，live/admin 任何一个没配好证书都变成事故。
# add_header Strict-Transport-Security "max-age=31536000" always;
