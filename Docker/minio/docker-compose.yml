# ==============================================================================
# MinIO —— 独立部署栈（不在主 docker-compose.yml 里）
#
# 为什么单拎出来：MinIO 于 2026-09-11 把 minio/minio 从 Docker Hub 整仓删除（404/denied），
# quay.io/minio/minio 又拒 GitHub Actions runner 那批共享 IP 的匿名拉取（401）——CI 的
# mirror-images job 把不到源，也就同步不到 GHCR。既然流水线这条路走不通，minio 就脱离
# 流水线、在部署机上直接拉 quay.io 单独起一个容器。im-server 经 host.docker.internal:9000 连它。
#
# 用法（★ 在主栈的同一台机器上，且务必在主栈 up 之前先起好本栈）：
#   1) cd 到 Docker/ 目录（与主 compose 同一个 .env，凭据共用）
#   2) 若从未登录过 quay：docker login quay.io
#      （公开镜像用任意免费 quay 账号登录即可抬高匿名限流；不登录常常 429/401）
#   3) docker compose -f minio/docker-compose.yml --env-file .env up -d
#   4) docker compose -f minio/docker-compose.yml --env-file .env ps   ← 确认 healthy 再起主栈
#
# ★ 与主栈的先后：主 compose 已去掉对 minio 的 depends_on（compose 无法跨两个项目做
#   service_healthy）。若本栈没先起来，im-server 会因连不上桶 fail-fast 反复重启。
# ==============================================================================

name: im-minio             # 卷名前缀（im-minio_minio-data）；独立于主栈的 im-docker，互不干扰

services:
  minio:
    # ★ 直接源用 quay.io（Docker Hub 的 minio/minio 已整仓消失）。具名 RELEASE 标签，
    #   不用 latest：回滚要有明确目标，且桶数据格式跨大版本可能不兼容。
    #   想换镜像站/私有仓库就在 .env 里设 MINIO_IMAGE，留空则回落这个 quay 默认。
    image: ${MINIO_IMAGE:-quay.io/minio/minio}:${MINIO_TAG:-RELEASE.2025-04-22T22-12-26Z}
    container_name: im-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # 与主栈共用同一个 .env：MINIO_ROOT_USER/PASSWORD 就是 conf/im.env 里
      # MINIO_ACCESS_KEY/SECRET_KEY 要填的那对值（bootstrap.sh 会把它们同步过去）。
      # 下限：PASSWORD ≥8 字符、USER ≥3 字符，短了容器直接退出（不是拒绝登录，是起不来）。
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?必填，不要用 minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?必填，≥8 位，不要用 minioadmin}
      TZ: Asia/Shanghai
    volumes:
      - minio-data:/data
    # ★ 这里【必须】发布到宿主机（不同于旧版藏在栈内用服务名访问）：im-server 是从容器里
    #   经 host.docker.internal（= docker 网桥网关 IP，如 172.17.0.1）连进来的，解析到的
    #   不是 127.0.0.1，所以不能写成 "127.0.0.1:9000:9000"，否则网关 IP 到不了。
    #   默认绑定 0.0.0.0＝对宿主所有网卡开放 9000/9001 —— Docker 发布的端口还绕过 UFW，
    #   务必靠云安全组/上游防火墙把 9000/9001 的来源限制成只允许本机或内网，别裸奔公网。
    ports:
      - "9000:9000"        # S3 API（im-server 上传/下载走这里）
      - "9001:9001"        # 控制台 Web（运维看桶用；不需要就注释掉这行）
    healthcheck:
      # 官方镜像自带 mc。若换的构建里没有，先 docker compose exec minio which mc 确认再改
      test: ["CMD-SHELL", "mc ready local"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

volumes:
  minio-data:
