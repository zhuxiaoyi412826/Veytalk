name: 💡 功能建议
description: 提出新功能或改进建议（先讨论方向，再动手写代码）
title: "[feat] "
labels:
  - enhancement
body:
  - type: markdown
    value: |
      **新增模块 / 引入新依赖 / 破坏性变更 / 架构级重构**，请先在这里把方向讨论清楚再动手——方向不对就是白干，这是 [`CONTRIBUTING.md` 八、外部贡献者](https://github.com/zhuxiaoyi412826/Veytalk/blob/main/CONTRIBUTING.md#八外部贡献者) 里的明确要求。

      想挑一个已经定好边界的事做，看 [`md/待开发功能.txt`](https://github.com/zhuxiaoyi412826/Veytalk/blob/main/md/%E5%BE%85%E5%BC%80%E5%8F%91%E5%8A%9F%E8%83%BD.txt) 里标 🚧 的项。
  - type: textarea
    id: motivation
    attributes:
      label: 需求背景与动机
      description: 什么场景下遇到什么不便？现在只能怎么绕过？"不做会怎样"比"做了什么"更有说服力
      placeholder: |
        群通话现在硬顶 6 人，超过就加不进来。班级活动要 20 人同时在线……
        目前只能拆成两个群分别开，信息对不齐。
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: 期望的功能与交互
      description: 希望怎么用（界面、入口、关键交互、失败时的表现）。有草图或参考产品可以贴图
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 考虑过但放弃的做法，以及为什么放弃（避免评审时重复讨论同一条路）
  - type: dropdown
    id: scope
    attributes:
      label: 预计涉及的层面
      description: 拿不准就选最宽的那档，宁可高估不要低估
      options:
        - 纯前端（im-ui / im-admin-ui / im-website）
        - Electron 桌面端（electron）
        - 后端单个模块内
        - 后端跨模块（需经 im-common 的 SPI）
        - 需要新增数据库表 / 字段
        - 需要新增外部依赖或服务（如 SFU、对象存储、第三方 API）
        - 不确定，请维护者判断
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 兼容性与代价
      description: 会破坏哪些现有行为？大概多少存储 / 流量 / 运维成本？老数据要不要迁移？
      placeholder: |
        例：换 SFU 需新增一台服务器并常驻进程；mesh 小房间逻辑要保留作降级。
  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue 与路线图（README「路线图 / Roadmap」），这不是重复建议
          required: true
        - label: 我理解本项目的硬性约定：任何改动都要在 md/CHANGELOG.md 登记一条
          required: true
        - label: 我愿意自己实现并提交 PR（不选也可以，只是排队会慢一些）
          required: false
